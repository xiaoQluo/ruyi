name: CI

on:
  push:
    branches: [main, dev/**]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 14
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-14-dev libclang-14-dev
          echo "LLVM_SYS_140_PREFIX=/usr/lib/llvm-14" >> $GITHUB_ENV
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: cargo build --workspace
      - name: Run tests
        run: cargo test --workspace

  codegen-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 14
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-14-dev libclang-14-dev
          echo "LLVM_SYS_140_PREFIX=/usr/lib/llvm-14" >> $GITHUB_ENV
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build ruyic
        run: cargo build -p ruyic
      - name: Run codegen integration tests
        run: cargo test -p ruyic --test codegen -- --ignored
