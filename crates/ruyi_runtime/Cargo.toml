[package]
name = "ruyi_runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
inkwell = { workspace = true, optional = true }
ruyi_exception = { workspace = true, default-features = false }
thiserror.workspace = true
once_cell = "1.19"
sha2 = "0.10"
mio = { version = "1", features = ["os-poll", "net", "os-ext"] }
hmac = "0.12"
sha-1 = "0.10"
aes-gcm = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }
flate2 = "1.0"
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "0.26"

[features]
default = ["inkwell"]
inkwell = ["dep:inkwell", "ruyi_exception/llvm20"]